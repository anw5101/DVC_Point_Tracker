name: Scrape Point Charts

on:
  schedule:
    # Run at 00:00 on December 1st every year
    - cron: '0 0 1 12 *'
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  scrape-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run AI Scraper
        env:
          # The GitHub Secret MUST be configured in the repository settings
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/scraper/fetchCharts.js

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update DVC point charts via AI scraper"
          title: "Update DVC Point Charts"
          body: |
            Automated Pull Request to update point charts.
            This PR was generated by the Gemini-powered Web Scraper Action.
            
            Please review the generated JSON files for accuracy before merging.
          branch: update-point-charts
          base: main
          labels: "automated pr, data"
